name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  appliance:
    name: IPS appliance test (crafted GENEVE packets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The appliance returns packets on a raw socket -> root required
      - run: sudo python3 tests/test_ips.py
